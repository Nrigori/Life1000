server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: life1000
  profiles:
    default: mysql
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

life1000:
  upload-directory: ${LIFE1000_UPLOAD_DIRECTORY:./uploads}
  auth:
    username: ${LIFE1000_USERNAME}
    password: ${LIFE1000_PASSWORD}
    jwt-secret: ${LIFE1000_JWT_SECRET}
    token-ttl-seconds: ${LIFE1000_TOKEN_TTL_SECONDS:7200}
