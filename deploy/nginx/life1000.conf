# Generated by start-local.ps1 with absolute Windows paths (forward slashes).
# Template tokens are replaced before nginx -t. Do not use this template directly.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
    include "__MIME_TYPES__";
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    server {
        listen 127.0.0.1:80;
        server_name localhost;
        # Nginx 只提供生产前端；uploads 不做静态映射，图片和文档必须经过后端 JWT 校验。
        root "__FRONTEND_DIST__";
        index index.html;
        # Existing backend limit: 50 MB file / 51 MB multipart request.
        client_max_body_size 51m;
        client_body_timeout 120s;
        location /api/ {
            # 保留 /api 前缀交给 Spring Boot；这里不能在代理目标末尾加斜杠而替换掉前缀。
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location / {
            # history 路由刷新时交回 Vue，避免详情和时间轴等前端路径被当作磁盘文件而返回 404。
            try_files $uri $uri/ /index.html;
        }
    }
}
